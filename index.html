<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusYa · Tiempos de paso EMT Madrid</title>
  <meta name="description" content="Consulta en tiempo real los tiempos de paso de los buses urbanos de EMT Madrid en cualquier parada." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>BusYa</h1>
    <p class="subtitle">Tiempos de paso en vivo · EMT Madrid</p>
  </header>

  <main>
    <form id="stop-form" class="stop-form" autocomplete="off">
      <label for="stop-id">Número de parada</label>
      <div class="stop-form__row">
        <input
          type="text"
          id="stop-id"
          name="stopId"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Ej. 72"
          required
        />
        <button type="submit">Buscar</button>
      </div>
    </form>

    <section id="status" class="status" aria-live="polite" hidden></section>

    <section id="results" class="results" hidden>
      <div class="results__header">
        <h2 id="stop-name">Parada</h2>
        <div class="results__meta">
          <span id="last-updated"></span>
          <button id="refresh-btn" type="button" title="Actualizar ahora">↻</button>
        </div>
      </div>
      <ul id="arrivals-list" class="arrivals-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>Datos de <a href="https://www.emtmadrid.es" target="_blank" rel="noopener">EMT Madrid</a> vía su API abierta. Actualización automática cada 30 s.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
